<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e7c5a">
    <title>Weekly Field Report</title>
    <link rel="manifest" href="field.manifest.json">
    <link rel="stylesheet" href="field.css?v=1">

    <!-- Firebase (compat) — same project/version as the desktop app -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
    <!-- Login -->
    <div id="login-overlay">
        <div class="login-card">
            <div class="login-logo">🗺️</div>
            <h1>Weekly Field Report</h1>
            <p class="login-sub">Sign in to capture field activity</p>
            <input type="email" id="login-email" placeholder="Email" autocomplete="username">
            <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password">
            <button id="btn-login">Sign In</button>
            <a href="#" id="link-forgot">Forgot password?</a>
            <p id="login-error"></p>
        </div>
    </div>

    <!-- App -->
    <div id="app-main" style="display:none;">
        <header class="app-bar">
            <span class="app-title">🗺️ Weekly Field Report</span>
            <button id="btn-logout" class="app-bar-btn">Logout</button>
        </header>
        <main>
            <!-- render_weekly.js renders here -->
            <div id="weekly-activity-wrapper"></div>
        </main>
    </div>

    <div id="toast-host"></div>

    <!-- The weekly engine (shared with desktop) + this page's boot glue -->
    <script src="render_weekly.js?v=22"></script>
    <script src="field_boot.js?v=1"></script>
</body>
</html>
