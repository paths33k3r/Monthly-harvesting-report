name: Daily Firebase Backup

on:
  schedule:
    - cron: '0 1 * * *' # Every day at 1:00 AM UTC (9:00 AM Malaysia time)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        # Pin the major versions so an upstream release can't silently break the
        # backup again (an unpinned `npm install firebase-admin` picked up a
        # release on 2026-06-09 whose changed default export crashed the script).
        run: npm install firebase-admin@^13.0.0 googleapis@^171.4.0

      - name: Run Backup Script
        run: node scripts/cloudBackup.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GDRIVE_CLIENT_ID:         ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET:     ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN:     ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID:         ${{ secrets.GDRIVE_FOLDER_ID }}

      # Safety net: keep the backup JSON as a downloadable artifact even when
      # the Drive upload fails (if: always() runs this step regardless of the
      # script's exit code). Artifacts are retained for 90 days.
      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-backup
          path: harvesting_backup_*.json
          retention-days: 90
          if-no-files-found: warn

